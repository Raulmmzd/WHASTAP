<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WA Mesaj">
<meta name="theme-color" content="#25D366">
<title>WA Mesaj</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f2f5;--card:#fff;--tx:#111b21;--mu:#667781;--bd:#d1d7db;--g:#25D366;--gd:#128C7E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b141a;--card:#1f2c34;--tx:#e9edef;--mu:#8696a0;--bd:#2a3942}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b141a;--card:#1f2c34;--tx:#e9edef;--mu:#8696a0;--bd:#2a3942}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;min-height:100vh}
.w{max-width:480px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:8px 0 4px;display:flex;align-items:center;gap:10px}
h1 svg{width:36px;height:36px;border-radius:9px}
p.s{color:var(--mu);margin:0 0 18px;font-size:14px}
.c{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:6px}
.r{display:flex;gap:8px;margin-bottom:14px}
select,input{font-size:18px;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
select{flex:0 0 118px}input{flex:1}
button{font-size:17px;border:0;border-radius:12px;padding:14px;cursor:pointer;font-weight:600}
.go{width:100%;background:var(--g);color:#fff;font-size:18px}
.go:active{background:var(--gd)}
.ps{background:var(--bg);color:var(--tx);border:1px solid var(--bd);width:100%;margin-bottom:14px;font-weight:500}
h2{font-size:14px;color:var(--mu);margin:22px 4px 8px;font-weight:600;display:flex;justify-content:space-between}
h2 a{color:var(--gd);cursor:pointer;font-weight:500}
.h{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 16px;border-radius:12px;margin-bottom:8px;font-size:17px;cursor:pointer}
.h span{color:var(--g);font-size:14px}
.n{font-size:12px;color:var(--mu);margin:16px 4px;line-height:1.5}
</style>
</head>
<body>
<div class="w">
<h1><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#25D366"/><path d="M50 18a32 32 0 0 0-27.5 48.3L18 82l16.2-4.2A32 32 0 1 0 50 18z" fill="#fff"/><path d="M40 33c-2 0-4 1.5-5 4-1 3 0 7 4 12s10 9 15 11c3 1 7 0 9-3 1-2 .5-3-1-4l-6-3c-1.5-.5-2.500 0-3.500 1.500-.8 1-1.500 1.200-2.500.8-4-2-7-5-9-8.500-.5-1 0-1.800.8-2.700 1-1 1.500-2 1-3.200l-2.500-6c-.5-1-1.500-1.700-2.800-1.700z" fill="#25D366"/></svg>WA Mesaj</h1>
<p class="s">Nömrəni saxlamadan birbaşa WhatsApp yazışmasını aç</p>
<div class="c">
<label>Ölkə kodu və nömrə</label>
<div class="r">
<select id="cc">
<option value="994">🇦🇿 +994</option><option value="90">🇹🇷 +90</option><option value="7">🇷🇺 +7</option><option value="995">🇬🇪 +995</option><option value="98">🇮🇷 +98</option><option value="44">🇬🇧 +44</option><option value="49">🇩🇪 +49</option><option value="1">🇺🇸 +1</option>
</select>
<input id="num" type="tel" inputmode="tel" placeholder="050 123 45 67" autocomplete="off">
</div>
<button class="ps" id="ps">📋 Kopyalanmış nömrəni yapışdır</button>
<button class="go" id="go">WhatsApp-da aç</button>
</div>
<h2><span>Son istifadə olunanlar</span><a id="clr">Təmizlə</a></h2>
<div id="hist"></div>
<p class="n">Qeyd: Brauzer/tətbiqlər telefonun zəng tarixçəsinə çıxış edə bilmir. Son zənglərdən nömrə üçün: Telefon → Son zənglər → nömrəyə toxunub saxla → Kopyala, sonra burada «Yapışdır» düyməsinə bas.</p>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var KEY='wa_hist';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function norm(raw,cc){
  var s=(raw||'').trim(),d=s.replace(/\D/g,'');
  if(!d)return '';
  if(s.charAt(0)==='+')return d;
  if(d.indexOf('00')===0)return d.slice(2);
  d=d.replace(/^0+/,'');
  if(d.indexOf(cc)===0&&d.length>=cc.length+7)return d;
  return cc+d;
}
function open(n){
  var h=load().filter(function(x){return x!==n});h.unshift(n);save(h.slice(0,10));render();
  window.location.href='https://wa.me/'+n;
}
function fmt(n){return '+'+n}
function render(){
  var h=load(),el=$('hist');el.innerHTML='';
  if(!h.length){el.innerHTML='<div class="n">Hələ heç nə yoxdur.</div>';return}
  h.forEach(function(n){
    var d=document.createElement('div');d.className='h';
    d.innerHTML='<b>'+fmt(n)+'</b><span>Aç ›</span>';
    d.onclick=function(){open(n)};el.appendChild(d);
  });
}
$('go').onclick=function(){
  var n=norm($('num').value,$('cc').value);
  if(n.length<8){alert('Nömrəni düzgün yaz');return}
  open(n);
};
$('num').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('ps').onclick=function(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(t){$('num').value=t.trim();}).catch(function(){$('num').focus();alert('İcazə verilmədi. Nömrə xanasına uzun basıb «Yapışdır» seç.')});
  }else{$('num').focus();alert('Nömrə xanasına uzun basıb «Yapışdır» seç.')}
};
$('clr').onclick=function(){save([]);render()};
render();
// ikon (ana ekrana əlavə üçün)
try{
  var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');
  x.fillStyle='#25D366';x.fillRect(0,0,180,180);
  x.fillStyle='#fff';x.beginPath();x.arc(90,86,58,0,7);x.fill();
  x.beginPath();x.moveTo(40,150);x.lineTo(52,112);x.lineTo(78,138);x.fill();
  x.fillStyle='#25D366';x.font='bold 70px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✆',90,88);
  var u=c.toDataURL('image/png');
  var l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
  var f=document.createElement('link');f.rel='icon';f.href=u;document.head.appendChild(f);
}catch(e){}
</script>
</body>
</html>
